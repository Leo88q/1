name: Android

on:
  push:
    branches: [main, arena/77b06826-1]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Ядро правил (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты ядра
        run: npm test

      - name: Типы
        run: npm run typecheck

      - name: Тест-векторы для Kotlin
        run: npm run vectors

      - uses: actions/upload-artifact@v4
        with:
          name: level-vectors
          path: packages/engine/vectors/levels.json
          if-no-files-found: error

  apk:
    name: APK (тесты + сборка)
    runs-on: ubuntu-latest
    needs: engine
    env:
      KEYSTORE_B64: ${{ secrets.AMPERGRAD_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/download-artifact@v4
        with:
          name: level-vectors
          path: packages/engine/vectors

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Сверка Kotlin-ядра с TS-каноном (unit-тесты)
        working-directory: app-android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Debug APK
        working-directory: app-android
        run: gradle :app:assembleDebug

      - name: Релизный ключ подписи (если задан в секретах)
        if: env.KEYSTORE_B64 != ''
        env:
          AMPERGRAD_KEYSTORE: ${{ github.workspace }}/ampergrad-release.jks
          AMPERGRAD_KEYSTORE_PASSWORD: ${{ secrets.AMPERGRAD_KEYSTORE_PASSWORD }}
          AMPERGRAD_KEY_ALIAS: ${{ secrets.AMPERGRAD_KEY_ALIAS }}
          AMPERGRAD_KEY_PASSWORD: ${{ secrets.AMPERGRAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$AMPERGRAD_KEYSTORE"
          echo "AMPERGRAD_KEYSTORE=$AMPERGRAD_KEYSTORE" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEYSTORE_PASSWORD=$AMPERGRAD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEY_ALIAS=$AMPERGRAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEY_PASSWORD=$AMPERGRAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Release APK (подписанный)
        if: env.KEYSTORE_B64 != ''
        working-directory: app-android
        run: gradle :app:assembleRelease

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app-android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: ampergrad-apk
          path: |
            app-android/app/build/outputs/apk/debug/*.apk
            app-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
