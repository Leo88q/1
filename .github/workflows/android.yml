name: Android

permissions:
  contents: write

on:
  push:
    branches: [main, arena/77b06826-1]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Ядро правил (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты ядра
        run: npm test

      - name: Типы
        run: npm run typecheck

      - name: Тест-векторы для Kotlin
        run: npm run vectors

      - uses: actions/upload-artifact@v5
        with:
          name: level-vectors
          path: packages/engine/vectors/levels.json
          if-no-files-found: error

  apk:
    name: APK (тесты + сборка)
    runs-on: ubuntu-latest
    needs: engine
    env:
      KEYSTORE_B64: ${{ secrets.AMPERGRAD_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v5
        with:
          name: level-vectors
          path: packages/engine/vectors

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Окружение (SDK, JDK, Gradle)
        run: |
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-<не задан>}}"
            echo "platforms:"
            ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}/platforms" || true
            echo "build-tools:"
            ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}/build-tools" || true
            java -version 2>&1 | head -3
            gradle --version 2>&1 | head -8
          } | tee environment.log

      - name: Kotlin-ядро против TS-канона (unit-тесты)
        working-directory: app-android
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee ../build-test.log

      - name: Debug APK
        working-directory: app-android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ../build-apk.log

      - name: Релизный ключ подписи (если задан в секретах)
        if: env.KEYSTORE_B64 != ''
        env:
          AMPERGRAD_KEYSTORE: ${{ github.workspace }}/ampergrad-release.jks
          AMPERGRAD_KEYSTORE_PASSWORD: ${{ secrets.AMPERGRAD_KEYSTORE_PASSWORD }}
          AMPERGRAD_KEY_ALIAS: ${{ secrets.AMPERGRAD_KEY_ALIAS }}
          AMPERGRAD_KEY_PASSWORD: ${{ secrets.AMPERGRAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$AMPERGRAD_KEYSTORE"
          echo "AMPERGRAD_KEYSTORE=$AMPERGRAD_KEYSTORE" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEYSTORE_PASSWORD=$AMPERGRAD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEY_ALIAS=$AMPERGRAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEY_PASSWORD=$AMPERGRAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Release APK (подписанный)
        if: env.KEYSTORE_B64 != ''
        working-directory: app-android
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee ../build-release.log

      # Логи сборки выкладываем в ветку ci-logs: blob-хранилище GitHub недоступно
      # из внешних сетей, а содержимое файла читается через api.github.com.
      - name: Лог сборки в ветку ci-logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOGDIR=$(mktemp -d)
          {
            echo "Сборка: $(date -u +%FT%TZ)  sha=${{ github.sha }}"
            echo
            echo "===== окружение ====="
            cat environment.log 2>/dev/null || echo "нет данных"
            for log in build-test.log build-apk.log build-release.log; do
              if [ -f "$log" ]; then
                echo
                echo "===== $log ====="
                tail -n 400 "$log"
              fi
            done
          } > "$LOGDIR/last-build.log"

          cd "$LOGDIR"
          git init -q -b ci-logs
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add last-build.log
          git -c user.name=ampergrad-ci -c user.email=ci@ampergrad.local commit -q -m "ci: лог сборки"
          git push -f -q origin ci-logs || echo "не удалось выложить лог"

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app-android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ampergrad-apk
          path: |
            app-android/app/build/outputs/apk/debug/*.apk
            app-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
