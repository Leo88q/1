name: Android

permissions:
  contents: write

on:
  push:
    branches: [main, arena/77b06826-1]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Ядро правил (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты ядра
        run: npm test

      - name: Типы
        run: npm run typecheck

      - name: Тест-векторы для Kotlin
        run: npm run vectors

      - name: Контент для клиента (лор, реестр)
        run: npm run content

      # Арт игры: спрайты для поля лежат собранными в packages/lab/public/art,
      # а их геометрия — перекованными в art/tiles/forged. Проверяем три вещи:
      # что закоммиченная ковка совпадает с той, что скрипт сделает заново
      # (иначе правки арта уедут незамеченными), что веб-версия не разошлась с
      # исходниками и — главное — что трубы реально соединялись на поле.
      - name: "Зависимости для арта (pillow, numpy)"
        run: python3 -m pip install --quiet pillow numpy

      - name: "Арт игры: ковка спрайтов совпадает с закоммиченной"
        run: |
          npm run art:forge
          git diff --exit-code art/tiles/forged || {
            echo "::error::перекованные спрайты отличаются от закоммиченных — выполните npm run art:forge и закоммитьте art/tiles/forged"
            exit 1
          }

      - name: "Арт игры: веб-версия собрана из исходников"
        run: npm run art:check

      - name: "Арт игры: трубы на поле соединяются"
        run: npm run art:seams

      # Ассеты витрины (иконка, фичер-график, скриншоты) рисуются скриптом из
      # настоящих кадров движка. Если рендерер поменяли, а картинки не
      # перерисовали, листинг уедет с устаревшим видом игры.
      - name: "Витрина: ассеты совпадают с рендерером"
        run: |
          if ! ls /usr/share/fonts/truetype/dejavu/*.ttf >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-dejavu-core
          fi
          python3 store/render_assets.py
          python3 store/render_assets.py --lang en
          python3 store/check_assets.py

      - name: "Сборка веб-игры"
        run: npm run build

      - name: "Арт игры: рендер рисует трубы"
        run: node packages/lab/scripts/smoke-render.mjs

      # Механизм для GUTTERCAPS живёт в двух видах: пакет в integrations/guttercaps/pr
      # и патч patch/*.patch, который владелец кладёт в их монорепо. Если пакет
      # поправили, а патч не пересобрали — патч уедет устаревшим, поэтому сверяем.
      - name: "Механизм для GUTTERCAPS: тесты пакета"
        run: node --experimental-strip-types --test integrations/guttercaps/pr/packages/ampergrad/test/*.test.ts

      - name: "Механизм для GUTTERCAPS: патч совпадает с пакетом"
        run: node integrations/guttercaps/tools/check-patch.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: level-vectors
          path: packages/engine/vectors/levels.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: content-json
          path: packages/engine/content/*.json
          if-no-files-found: error

  apk:
    name: APK (тесты + сборка)
    runs-on: ubuntu-latest
    needs: engine
    env:
      KEYSTORE_B64: ${{ secrets.AMPERGRAD_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v5
        with:
          name: level-vectors
          path: packages/engine/vectors

      - uses: actions/download-artifact@v5
        with:
          name: content-json
          path: packages/engine/content

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.1'

      - name: "Android SDK: платформа 37 и build-tools"
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -3 || \
            echo "платформу 37 поставит сам AGP (android.builder.sdkDownload)"

      - name: Окружение (SDK, JDK, Gradle)
        run: |
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-<не задан>}}"
            echo "platforms:"
            ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}/platforms" || true
            echo "build-tools:"
            ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}/build-tools" || true
            java -version 2>&1 | head -3
            gradle --version 2>&1 | head -8
          } | tee environment.log

      - name: Тест-векторы и контент в модуль приложения
        run: |
          mkdir -p app-android/app/src/test/resources app-android/app/src/main/assets
          cp packages/engine/vectors/levels.json app-android/app/src/test/resources/levels.json
          for f in lore.json cosmetics.json; do
            cp "packages/engine/content/$f" "app-android/app/src/test/resources/$f"
            cp "packages/engine/content/$f" "app-android/app/src/main/assets/$f"
          done
          # Контракт арта — для unit-теста ArtPackTest. Спрайты в assets кладёт
          # gradle-задача syncContent, ей доступен весь каталог packages/lab/public/art.
          cp packages/lab/public/art/web.json app-android/app/src/test/resources/web.json

      - name: Kotlin-ядро против TS-канона (unit-тесты)
        working-directory: app-android
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee ../build-test.log

      - name: Debug APK
        working-directory: app-android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ../build-apk.log

      # Арт обязан лежать внутри APK: без него игра молча уедет в режим схемы,
      # а внешне это выглядит как «сборка прошла». Поэтому проверяем содержимое.
      - name: "Арт внутри APK"
        working-directory: app-android
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          COUNT=$(unzip -l "$APK" | grep -c 'assets/art/' || true)
          echo "файлов арта в APK: $COUNT"
          unzip -l "$APK" | grep 'assets/art/web.json' || {
            echo "::error::в APK нет assets/art/web.json — арт не попал в сборку"
            exit 1
          }
          test "$COUNT" -ge 55 || { echo "::error::в APK только $COUNT файлов арта, ожидалось не меньше 55"; exit 1; }

      - name: Релизный ключ подписи (если задан в секретах)
        if: env.KEYSTORE_B64 != ''
        env:
          AMPERGRAD_KEYSTORE: ${{ github.workspace }}/ampergrad-release.jks
          AMPERGRAD_KEYSTORE_PASSWORD: ${{ secrets.AMPERGRAD_KEYSTORE_PASSWORD }}
          AMPERGRAD_KEY_ALIAS: ${{ secrets.AMPERGRAD_KEY_ALIAS }}
          AMPERGRAD_KEY_PASSWORD: ${{ secrets.AMPERGRAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$AMPERGRAD_KEYSTORE"
          echo "AMPERGRAD_KEYSTORE=$AMPERGRAD_KEYSTORE" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEYSTORE_PASSWORD=$AMPERGRAD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEY_ALIAS=$AMPERGRAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AMPERGRAD_KEY_PASSWORD=$AMPERGRAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Release APK (подписанный)
        if: env.KEYSTORE_B64 != ''
        working-directory: app-android
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee ../build-release.log

      # Логи сборки выкладываем в ветку ci-logs: blob-хранилище GitHub недоступно
      # из внешних сетей, а содержимое файла читается через api.github.com.
      - name: Лог сборки в ветку ci-logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOGDIR=$(mktemp -d)
          {
            echo "Сборка: $(date -u +%FT%TZ)  sha=${{ github.sha }}"
            echo
            echo "===== окружение ====="
            cat environment.log 2>/dev/null || echo "нет данных"
            for log in build-test.log build-apk.log build-release.log; do
              if [ -f "$log" ]; then
                echo
                echo "===== $log ====="
                tail -n 400 "$log"
              fi
            done
          } > "$LOGDIR/last-build.log"

          cd "$LOGDIR"
          git init -q -b ci-logs
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add last-build.log
          git -c user.name=ampergrad-ci -c user.email=ci@ampergrad.local commit -q -m "ci: лог сборки"
          git push -f -q origin ci-logs || echo "не удалось выложить лог"

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app-android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ampergrad-apk
          path: |
            app-android/app/build/outputs/apk/debug/*.apk
            app-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Артефакты лежат в blob-хранилище, недоступном из части сетей, поэтому тот же
      # APK кладём в Release: оттуда файл открывается по обычной ссылке в браузере.
      - name: APK в Releases (установка на телефон)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=android-build
          FILES=$(ls app-android/app/build/outputs/apk/debug/*.apk app-android/app/build/outputs/apk/release/*.apk 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "APK не найдены"; exit 0; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease \
            --title "Амперград — APK (автосборка)" \
            --notes "Последняя автоматическая сборка Android-приложения (ветка arena/77b06826-1). Debug-APK ставится на устройство сразу; игра работает офлайн, кошелёк нужен только для клейма награды."
          gh release upload "$TAG" $FILES --clobber
