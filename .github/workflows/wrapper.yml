name: Gradle wrapper

# Генерация gradle wrapper (для локальной сборки APK без установки Gradle).
# В CI сборка идёт системным Gradle 9.8.1. Готовые файлы выкладываются в ветку ci-wrapper.
# Запускается при изменении самого workflow (workflow_dispatch недоступен: файл только в рабочей ветке).
on:
  push:
    branches: [arena/77b06826-1]
    paths:
      - '.github/workflows/wrapper.yml'
      - 'app-android/gradle/wrapper/**'

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.1'

      - name: Сгенерировать wrapper
        working-directory: app-android
        run: gradle wrapper --gradle-version 9.8.1 --distribution-type bin

      - name: Выложить wrapper в ветку ci-wrapper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name ampergrad-ci
          git config user.email ci@ampergrad.local
          git checkout -b ci-wrapper
          git add -f app-android/gradlew app-android/gradlew.bat app-android/gradle/wrapper/
          git commit -q -m "ci: gradle wrapper 9.8.1"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-wrapper
          echo "wrapper в ветке ci-wrapper"
