name: Gradle wrapper

# Одноразовая генерация gradle wrapper для локальной сборки APK.
# В CI сборка идёт системным Gradle 9.8.1, wrapper — удобство для разработчика.
on:
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.1'

      - name: Сгенерировать wrapper
        working-directory: app-android
        run: gradle wrapper --gradle-version 9.8.1 --distribution-type bin

      - uses: actions/upload-artifact@v5
        with:
          name: gradle-wrapper
          if-no-files-found: error
          path: |
            app-android/gradlew
            app-android/gradlew.bat
            app-android/gradle/wrapper/gradle-wrapper.jar
            app-android/gradle/wrapper/gradle-wrapper.properties
